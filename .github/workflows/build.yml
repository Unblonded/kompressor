name: build

# Every push builds all three platforms. A push to main (or a manual run) then publishes a GitHub release
# named v<version>-<build number>, with <version> taken from project() in CMakeLists.txt.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure (vcpkg static)
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset windows
      - name: Smoke test
        shell: bash
        run: |
          ./build/windows/kompressor-cli.exe super t.kmp src -m fast
          ./build/windows/kompressor-cli.exe test t.kmp
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./packaging/windows/build_installer.ps1
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/Kompressor.exe, build/windows/KompShell.dll, build/windows/kompressor-cli.exe `
            -DestinationPath dist/Kompressor-windows-x64.zip
          Copy-Item build/windows/installer/KompressorSetup-*.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos-universal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap vcpkg
        run: |
          # A full clone: vcpkg.json pins a baseline commit that a shallow clone doesn't have.
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
      - run: brew install ninja
      - name: Configure (Universal 2)
        run: cmake --preset macos-universal
      - name: Build
        run: cmake --build --preset macos-universal
      - name: Check architectures + smoke test
        run: |
          lipo -info build/macos-universal/Kompressor.app/Contents/MacOS/Kompressor
          ./build/macos-universal/kompressor-cli super t.kmp src -m fast
          ./build/macos-universal/kompressor-cli test t.kmp
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/macos-universal/Kompressor.app dist/Kompressor-macOS-universal.zip
          tar -czf dist/kompressor-cli-macOS-universal.tar.gz -C build/macos-universal kompressor-cli
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libarchive-dev liblzma-dev libzstd-dev \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libdbus-1-dev
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Smoke test
        run: |
          ./build/release/kompressor-cli super t.kmp src -m ultra
          ./build/release/kompressor-cli test t.kmp
          ./build/release/kompressor-cli create t.7z src && ./build/release/kompressor-cli test t.7z
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/Kompressor-linux-x64.tar.gz -C build/release Kompressor kompressor-cli
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    needs: [windows, macos-universal, linux]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^project\(Kompressor VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          tag="v${version}-${GITHUB_RUN_NUMBER}"
          ls -l dist
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Kompressor ${version} (build ${GITHUB_RUN_NUMBER})" \
            --generate-notes \
            --latest
